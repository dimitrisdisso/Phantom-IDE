# PHANTOM Live Session relay (Cloudflare Workers + Durable Objects, free plan compatible).
# Deploy:  cd relay  →  npx wrangler@4 login  →  npx wrangler@4 deploy
name = "phantom-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
